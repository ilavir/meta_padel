{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <div class="row mb-3">
        <div class="col">
            <h1 class="text-center">{{ title }}</h1>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col text-end">
            <a href="{{ url_for('rating.add_score_template') }}" class="btn btn-primary">Добавить шаблон</a>
        </div>
    </div>
    <div class="row">
        <div class="col">

            {% if templates %}
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col" class="col-2">Имя</th>
                        <th scope="col">Комментарий</th>
                        <th scope="col" class="text-end">Очки</th>
                        <th scope="col" style="width: 60px;"></th>
                    </tr>
                </thead>
                <tbody>
                    {% for template in templates %}
                    <tr>
                        <td scope="row">{{ template.name }}</th>
                        <td>{{ template.comment }}</td>
                        <td class="text-end">{{ template.score }}</td>
                        <td>
                            <a href="{{ url_for('rating.edit_score_template', template_id=template.id) }}" class="btn btn-primary btn-sm">Изменить</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
